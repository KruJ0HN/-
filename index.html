<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบผลการเรียน - ครูจอห์น</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEUcm3PNWFGI_3tldA1-YgAt91Jujj5VX2DV7EFymFS_eQI9IKxigj1Pc8WZjAa9bxHg/exec";
    </script>

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold">ระบบตรวจสอบผลการเรียน</h1>
                    <p class="text-xs text-indigo-200">ระบบติดตามและเช็คคะแนนนักเรียน/นักศึกษา</p>
                </div>
            </div>
            <button id="navToggleBtn" type="button" onclick="toggleRole()" class="bg-indigo-600 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                <i class="fa-solid fa-user-shield mr-1"></i> เข้าสู่ระบบแอดมิน (ครู)
            </button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4 md:p-6">

        <!-- STUDENT SECTION -->
        <div id="studentSection" class="space-y-6">
            
            <!-- Student Login Card -->
            <div id="studentLoginForm" class="bg-white p-8 rounded-2xl shadow-md max-w-md mx-auto border border-slate-200">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">เข้าสู่ระบบสำหรับนักเรียน</h2>
                <p class="text-slate-500 text-sm mb-6 text-center">กรอกอีเมลจริงและรหัสผ่านเพื่อเข้าดูคะแนน</p>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-600">อีเมล <span class="text-red-500">*</span></label>
                        <input type="email" id="studentEmailInput" placeholder="student@example.com" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">รหัสผ่าน <span class="text-red-500">*</span></label>
                        <input type="password" id="studentPasswordInput" placeholder="รหัสผ่านเข้าสู่ระบบ" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm mt-1">
                    </div>
                    <button type="button" id="btnLogin" onclick="handleStudentLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                        <span>เข้าสู่ระบบ</span>
                    </button>
                </div>
                <div class="mt-6 pt-4 border-t text-sm text-slate-600 text-center">
                    ยังไม่มีบัญชีใช่ไหม? <button type="button" onclick="showStudentRegister()" class="text-indigo-600 font-bold hover:underline">สมัครสมาชิกที่นี่</button>
                </div>
            </div>

            <!-- Student Register Card -->
            <div id="studentRegisterForm" class="hidden bg-white p-8 rounded-2xl shadow-md max-w-md mx-auto border border-slate-200">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">ลงทะเบียนนักเรียน</h2>
                    <p class="text-slate-500 text-sm">กรอกอีเมลจริงเพื่อรับรหัสยืนยัน OTP</p>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-600">อีเมลจริง <span class="text-red-500">*</span> (ระบบจะส่ง OTP ไปที่นี่)</label>
                        <input type="email" id="regEmail" placeholder="student@example.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600">ตั้งรหัสผ่าน <span class="text-red-500">*</span></label>
                            <input type="password" id="regPassword" placeholder="อย่างน้อย 4 ตัวอักษร" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600">ยืนยันรหัสผ่าน <span class="text-red-500">*</span></label>
                            <input type="password" id="regPasswordConfirm" placeholder="พิมพ์รหัสผ่านเดิมซ้ำ" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">ชื่อ - นามสกุลจริง <span class="text-red-500">*</span></label>
                        <input type="text" id="regName" placeholder="นายสมชาย รักดี" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">รหัสนักเรียน/นักศึกษา <span class="text-red-500">*</span></label>
                        <input type="text" id="regStudentId" placeholder="เช่น 660123" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    </div>
                    <button type="button" id="btnRegister" onclick="handleStudentRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md mt-2 flex justify
